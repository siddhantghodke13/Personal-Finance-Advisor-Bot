{% extends "base.html" %}

{% block title %}404 — Page Not Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5" style="max-width: 500px; margin: 0 auto;">
        <div class="display-1 fw-extrabold text-primary mb-3">404</div>
        <h3 class="fw-bold mb-2">Page Not Found</h3>
        <p class="text-muted mb-4">The financial record or page you were looking for doesn't exist or has moved.</p>
        <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('index') }}" class="btn btn-primary fw-semibold px-4 py-2">
            <i class="bi bi-house-door-fill me-1"></i> Return to Safety
        </a>
    </div>
</div>
{% endblock %}
