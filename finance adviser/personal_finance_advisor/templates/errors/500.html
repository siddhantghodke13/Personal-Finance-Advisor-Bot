{% extends "base.html" %}

{% block title %}500 — Server Error{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5" style="max-width: 500px; margin: 0 auto;">
        <div class="display-1 fw-extrabold text-danger mb-3">500</div>
        <h3 class="fw-bold mb-2">Something Went Wrong</h3>
        <p class="text-muted mb-4">An unexpected server error occurred while processing your request. Please try again or return to the dashboard.</p>
        <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('index') }}" class="btn btn-primary fw-semibold px-4 py-2">
            <i class="bi bi-house-door-fill me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
